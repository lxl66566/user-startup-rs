[package]
name        = "user-startup"
version     = "0.4.0"
edition     = "2024"
description = "Simple cross-platform tool to make your command auto run on startup"
readme      = "README.md"
homepage    = "https://github.com/lxl66566/user-startup-rs"
repository  = "https://github.com/lxl66566/user-startup-rs"
license     = "MIT"
keywords    = [
  "auto-run",
  "autostart",
  "startup",
  "startup-command",
  "startup-script",
]
categories  = ["command-line-utilities"]

[lib]
name = "user_startup"
path = "src/lib.rs"

[[bin]]
name              = "user-startup"
path              = "src/main.rs"
required-features = ["bin"]

[dependencies]
clap              = { version = "4.6", features = ["derive"], optional = true }
comfy-table       = { version = "8", optional = true }
dirs              = "7.0.0"
log               = "0.4"
pretty_env_logger = { version = "0.5", optional = true }
thiserror         = "2.0"

[dev-dependencies]
tempfile = "3"

[features]
default = ["bin"]
bin     = ["clap", "comfy-table", "pretty_env_logger"]

[lints.clippy]
all                     = { level = "warn", priority = -1 }
cargo                   = { level = "warn", priority = -1 }
doc_markdown            = "allow"
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
multiple_crate_versions = "allow"
pedantic                = { level = "warn", priority = -1 }
wildcard_imports        = "allow"

[lints.rust]
unsafe_code           = "allow"
unused_qualifications = "warn"

[profile.release]
opt-level = "s"
strip     = true
lto       = true
panic     = "abort"
